plugins { id 'com.android.application' }
android {
    namespace 'org.xylonic.fiber'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'org.xylonic.fiber'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        // phones by default; an emulator needs x86_64: ./gradlew assembleDebug -Pxf.abis=x86_64
        ndk { abiFilters((project.findProperty('xf.abis') ?: 'arm64-v8a,armeabi-v7a').split(',') as String[]) }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared'; cppFlags '-O3 -fno-plt' } }
    }
    externalNativeBuild { cmake { path 'jni/CMakeLists.txt'; version '3.22.1' } }
    sourceSets { main { assets.srcDirs = ['../../assets'] } }
    // Release signing: create android/keystore.properties (storeFile, storePassword, keyAlias, keyPassword); it is git-ignored.
    def ksFile = rootProject.file('keystore.properties')
    if (ksFile.exists()) {
        def ks = new Properties(); ks.load(new FileInputStream(ksFile))
        signingConfigs { release {
            storeFile file(ks['storeFile']); storePassword ks['storePassword']; keyAlias ks['keyAlias']; keyPassword ks['keyPassword']
        } }
    }
    buildTypes { release {
        minifyEnabled false
        if (ksFile.exists()) signingConfig signingConfigs.release
    } }
}
