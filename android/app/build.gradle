plugins { id 'com.android.application' }
android {
    namespace 'org.xylonic.fiber'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'org.xylonic.fiber'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        // phones by default; an emulator needs x86_64: ./gradlew assembleDebug -Pxf.abis=x86_64
        ndk { abiFilters((project.findProperty('xf.abis') ?: 'arm64-v8a,armeabi-v7a').split(',') as String[]) }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared'; cppFlags '-O2' } }
    }
    externalNativeBuild { cmake { path 'jni/CMakeLists.txt'; version '3.22.1' } }
    sourceSets { main { assets.srcDirs = ['../../assets'] } }
    buildTypes { release { minifyEnabled false } }
}
