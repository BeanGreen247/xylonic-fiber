plugins { id 'com.android.application' }
android {
    namespace 'org.xylonic.fiber'
    compileSdk 35
    defaultConfig {
        applicationId 'org.xylonic.fiber'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared'; cppFlags '-O2' } }
    }
    externalNativeBuild { cmake { path 'jni/CMakeLists.txt' } }
    sourceSets { main { assets.srcDirs = ['../../assets'] } }
    buildTypes { release { minifyEnabled false } }
}
